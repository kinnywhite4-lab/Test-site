<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>NovaVest - Admin Control Panel</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #0284c7;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --sidebar: #0f172a;
      --border: #e2e8f0;
      --pill-bg: #f8fafc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; min-height: 100vh; }
    
    .top-bar { background: #fff; border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 1000; }
    .top-bar .title-group { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; }
    .btn-menu { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--text); }
    .btn-key { background: #e0f2fe; color: var(--primary); border: 1px solid #bae6fd; padding: 6px 12px; border-radius: 6px; font-weight: 600; cursor: pointer; }

    .sidebar { position: fixed; top: 0; left: -280px; width: 280px; height: 100vh; background: var(--sidebar); color: #fff; z-index: 1100; transition: left 0.3s; padding: 20px; overflow-y: auto; }
    .sidebar.open { left: 0; }
    .sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 12px; border-bottom: 1px solid #334155; }
    .sidebar-section-title { font-size: 11px; text-transform: uppercase; color: #94a3b8; letter-spacing: 0.5px; margin: 18px 0 8px; }
    .nav-btn { width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: none; border: none; color: #cbd5e1; font-size: 14px; border-radius: 8px; cursor: pointer; text-align: left; }
    .nav-btn.active, .nav-btn:hover { background: #1e293b; color: #fff; }
    .nav-btn i { width: 18px; font-size: 16px; }
    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1050; }
    .overlay.open { display: block; }

    .admin-main { padding: 16px; max-width: 650px; margin: 0 auto; width: 100%; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* User Management Styles (Reference Design) */
    .user-card { background: #fff; border: 1px solid var(--border); border-radius: 16px; padding: 18px; margin-bottom: 16px; box-shadow: 0 2px 6px rgba(0,0,0,0.02); }
    .user-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .phone-text { font-size: 18px; font-weight: 800; color: #0f172a; }
    .badge-ban { background: #fee2e2; color: #ef4444; border: 1px solid #fecaca; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 20px; cursor: pointer; }
    .badge-ban.banned { background: #ef4444; color: #fff; }
    .user-subinfo { font-size: 12px; color: var(--muted); margin-bottom: 12px; line-height: 1.5; }

    .action-button-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .pill-btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; border: none; cursor: pointer; }
    .pill-blue { background: #e0f2fe; color: #0369a1; }
    .pill-gray { background: #f1f5f9; color: #475569; }
    .pill-dark { background: #0f172a; color: #fff; }
    .pill-red { background: #fee2e2; color: #b91c1c; }

    .toggle-package-box { background: var(--pill-bg); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .toggle-package-box span { font-size: 13px; font-weight: 600; }
    .toggle-package-box small { display: block; font-size: 11px; font-weight: 700; color: var(--success); }

    /* Balance Adjustment Box */
    .balance-adjust-panel { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 16px; }
    .adjust-inputs { display: flex; gap: 8px; margin-bottom: 10px; }
    .adjust-inputs input { flex: 1; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; outline: none; }
    .adjust-inputs select { padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; outline: none; background: #fff; }
    .adjust-btns { display: flex; gap: 8px; }
    .btn-add { flex: 1; background: #0284c7; color: #fff; padding: 10px; border-radius: 8px; border: none; font-weight: 700; cursor: pointer; }
    .btn-subtract { flex: 1; background: #f1f5f9; color: #334155; padding: 10px; border-radius: 8px; border: 1px solid var(--border); font-weight: 700; cursor: pointer; }

    /* Balances Detail Grid */
    .user-balance-summary { background: #f8fafc; border-radius: 14px; padding: 14px; border: 1px solid var(--border); margin-bottom: 16px; }
    .bal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    .bal-item .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .bal-item .val { font-size: 17px; font-weight: 800; color: #0f172a; margin-top: 2px; }
    .bal-divider { border-top: 1px dashed var(--border); margin: 8px 0; }

    /* Sub-History Sections inside User */
    .user-subtabs { display: flex; border-bottom: 1px solid var(--border); gap: 12px; margin-bottom: 14px; overflow-x: auto; }
    .subtab-btn { background: none; border: none; padding: 8px 4px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; }
    .subtab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
    .sub-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f1f5f9; font-size: 12px; }
    .sub-item:last-child { border-bottom: none; }
    .sub-badge { padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 700; }

    /* Search input */
    .search-bar { width: 100%; padding: 12px 16px; border: 1px solid var(--border); border-radius: 12px; background: #fff; margin-bottom: 16px; outline: none; font-size: 14px; }
  </style>
</head>
<body>

  <header class="top-bar">
    <div class="title-group">
      <i class="fa-solid fa-bolt" style="color: #0284c7;"></i>
      <span id="page-heading">User Management</span>
    </div>
    <div style="display: flex; gap: 8px;">
      <button class="btn-key" id="btn-set-key"><i class="fa-solid fa-key"></i> Key</button>
      <button class="btn-menu" id="btn-toggle-menu"><i class="fa-solid fa-bars"></i></button>
    </div>
  </header>

  <div class="overlay" id="overlay"></div>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span style="font-weight: 800; font-size: 16px;">ADMIN PANEL</span>
      <button id="btn-close-sidebar" style="background: none; border: none; color: #fff; font-size: 18px; cursor: pointer;">&times;</button>
    </div>
    
    <div class="sidebar-section-title">Overview</div>
    <button class="nav-btn active" data-tab="tab-users"><i class="fa-solid fa-users"></i> User Management</button>
  </aside>

  <main class="admin-main">
    <section id="tab-users" class="tab-content active">
      <input type="text" id="user-search-input" class="search-bar" placeholder="Search by Phone Number, UID, or Ref Code..." />
      <div id="users-container">Loading users...</div>
    </section>
  </main>

  <script>
    let adminKey = localStorage.getItem('nv_admin_key') || 'novavest_admin_2026';
    let loadedUsers = [];
    let expandedUserId = null;

    function setKey() {
      const input = prompt('Enter Admin Key:', adminKey);
      if (input) {
        adminKey = input.trim();
        localStorage.setItem('nv_admin_key', adminKey);
        loadUsers();
      }
    }
    document.getElementById('btn-set-key').onclick = setKey;

    async function adminFetch(action, options = {}) {
      options.headers = options.headers || {};
      options.headers['x-admin-key'] = adminKey;
      if (options.body && typeof options.body === 'object') {
        options.headers['Content-Type'] = 'application/json';
        options.body = JSON.stringify(options.body);
      }
      const res = await fetch(`/api/admin?action=${action}`, options);
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Failed request.');
      return data;
    }

    // Sidebar
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    document.getElementById('btn-toggle-menu').onclick = () => { sidebar.classList.add('open'); overlay.classList.add('open'); };
    document.getElementById('btn-close-sidebar').onclick = () => { sidebar.classList.remove('open'); overlay.classList.remove('open'); };
    overlay.onclick = () => { sidebar.classList.remove('open'); overlay.classList.remove('open'); };

    function fmt(n) {
      return '₦' + parseFloat(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    // Load initial user list
    async function loadUsers() {
      const container = document.getElementById('users-container');
      try {
        const { users } = await adminFetch('users');
        loadedUsers = users;
        renderUsersList(users);
      } catch (err) {
        container.innerHTML = `<div style="color:red;padding:20px;text-align:center;">${err.message}</div>`;
      }
    }

    // Filter/Search Handler
    document.getElementById('user-search-input').addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase().trim();
      const filtered = loadedUsers.filter(u => 
        (u.phone_number && u.phone_number.includes(term)) ||
        (u.referral_code && u.referral_code.toLowerCase().includes(term)) ||
        String(u.id).includes(term)
      );
      renderUsersList(filtered);
    });

    function renderUsersList(users) {
      const container = document.getElementById('users-container');
      if (!users.length) {
        container.innerHTML = '<p style="text-align:center;color:#64748b;padding:30px;">No users found.</p>';
        return;
      }

      container.innerHTML = users.map(u => `
        <div class="user-card" id="user-card-${u.id}">
          <div class="user-card-header">
            <span class="phone-text">${u.phone_number}</span>
            <button class="badge-ban ${u.is_banned ? 'banned' : ''}" onclick="toggleBan(${u.id})">
              ${u.is_banned ? 'BANNED' : 'Ban'}
            </button>
          </div>
          <div class="user-subinfo">
            Code: <strong>${u.referral_code || '---'}</strong> &bull; Deposit: <strong>${fmt(u.deposit_balance)}</strong> &bull; Withdrawal: <strong>${fmt(u.withdrawable_balance)}</strong>
          </div>

          <div id="user-details-target-${u.id}">
            <button class="pill-btn pill-gray" onclick="toggleUserDetails(${u.id})">
              <i class="fa-solid fa-chevron-down"></i> View Full Details & Controls
            </button>
          </div>
        </div>
      `).join('');
    }

    // Toggle detailed view for selected user
    async function toggleUserDetails(userId) {
      const target = document.getElementById(`user-details-target-${userId}`);
      if (expandedUserId === userId) {
        target.innerHTML = `<button class="pill-btn pill-gray" onclick="toggleUserDetails(${userId})"><i class="fa-solid fa-chevron-down"></i> View Full Details & Controls</button>`;
        expandedUserId = null;
        return;
      }

      target.innerHTML = '<p style="font-size:12px;color:#64748b;padding:10px 0;">Loading full profile...</p>';

      try {
        const { user, deposits, withdrawals, purchases, logs } = await adminFetch(`user-detail&user_id=${userId}`);
        expandedUserId = userId;

        target.innerHTML = `
          <!-- Action Buttons Bar matching reference screenshot -->
          <div class="action-button-grid" style="margin-top:10px;">
            <button class="pill-btn pill-blue" onclick="impersonateUser(${user.id})">
              <i class="fa-solid fa-arrow-right-to-bracket"></i> Login as User
            </button>
            <button class="pill-btn ${user.is_promoter ? 'pill-blue' : 'pill-gray'}" onclick="togglePromoter(${user.id})">
              <i class="fa-solid fa-star"></i> ${user.is_promoter ? 'Promoter: Active' : 'Mark Promoter'}
            </button>
            <button class="pill-btn pill-gray" onclick="switchUserTab(${user.id}, 'logs')">
              <i class="fa-solid fa-file-lines"></i> View Logs
            </button>
            <button class="pill-btn pill-dark" onclick="resetPassword(${user.id})">
              <i class="fa-solid fa-key"></i> PWD RESET
            </button>
            <button class="pill-btn pill-red" onclick="deleteUser(${user.id})">
              <i class="fa-solid fa-trash"></i> Delete User
            </button>
          </div>

          <!-- Withdrawal Without Package Switch -->
          <div class="toggle-package-box">
            <div>
              <span>Withdraw without package</span>
              <small>${user.withdraw_without_package ? 'ENABLED' : 'DISABLED'}</small>
            </div>
            <button class="pill-btn pill-gray" onclick="togglePackageRule(${user.id})">Toggle</button>
          </div>

          <!-- Balance Adjustment Form -->
          <div class="balance-adjust-panel">
            <div class="adjust-inputs">
              <input type="number" id="adj-amount-${user.id}" placeholder="Amount (₦)" min="1" step="any" />
              <select id="adj-wallet-${user.id}">
                <option value="withdrawal">Withdrawal wallet</option>
                <option value="deposit">Deposit wallet</option>
              </select>
            </div>
            <div class="adjust-btns">
              <button class="btn-add" onclick="handleAdjust(${user.id}, 'add')">Add</button>
              <button class="btn-subtract" onclick="handleAdjust(${user.id}, 'subtract')">Subtract</button>
            </div>
          </div>

          <!-- Balances Display matching Reference Separation -->
          <div class="user-balance-summary">
            <div class="bal-grid">
              <div class="bal-item">
                <div class="lbl">Withdrawal balance</div>
                <div class="val">${fmt(user.withdrawable_balance)}</div>
              </div>
              <div class="bal-item">
                <div class="lbl">Deposit balance</div>
                <div class="val">${fmt(user.deposit_balance)}</div>
              </div>
            </div>
            <div class="bal-grid">
              <div class="bal-item">
                <div class="lbl">Total deposited</div>
                <div class="val">${fmt(user.total_deposited)}</div>
              </div>
              <div class="bal-item">
                <div class="lbl">Total withdrawn</div>
                <div class="val">${fmt(user.total_withdrawn)}</div>
              </div>
            </div>
            <div class="bal-divider"></div>
            <div style="font-size:12px;color:#64748b;line-height:1.6;">
              <div><strong>UID:</strong> ${user.id} &bull; <strong>Invited by:</strong> ${user.referred_by || 'N/A'}</div>
              <div><strong>Joined:</strong> ${new Date(user.created_at).toLocaleString()}</div>
              <div><strong>Bank:</strong> ${user.bank_name ? `${user.bank_name} &bull; ${user.account_number} &bull; ${user.account_name}` : 'No bank card saved'}</div>
            </div>
          </div>

          <!-- History & Logs Tabs -->
          <div class="user-subtabs">
            <button class="subtab-btn active" id="btn-tab-dep-${user.id}" onclick="renderSubList(${user.id}, 'deposits')">Deposits (${deposits.length})</button>
            <button class="subtab-btn" id="btn-tab-with-${user.id}" onclick="renderSubList(${user.id}, 'withdrawals')">Withdrawals (${withdrawals.length})</button>
            <button class="subtab-btn" id="btn-tab-inv-${user.id}" onclick="renderSubList(${user.id}, 'investments')">Investments (${purchases.length})</button>
            <button class="subtab-btn" id="btn-tab-logs-${user.id}" onclick="renderSubList(${user.id}, 'logs')">Audit Logs (${logs.length})</button>
          </div>
          <div id="subtab-content-${user.id}"></div>
        `;

        // Store user subdata in memory for instantaneous tab switching
        window[`userData_${user.id}`] = { deposits, withdrawals, purchases, logs };
        renderSubList(user.id, 'deposits');

      } catch (err) {
        target.innerHTML = `<p style="color:red;font-size:12px;">Failed to load user details: ${err.message}</p>`;
      }
    }

    // Switch between Deposits, Withdrawals, Investments, and Logs
    function renderSubList(userId, tab) {
      const data = window[`userData_${userId}`];
      if (!data) return;

      document.querySelectorAll(`#user-card-${userId} .subtab-btn`).forEach(b => b.classList.remove('active'));
      const activeBtn = document.getElementById(`btn-tab-${tab.substring(0,3)}-${userId}`);
      if (activeBtn) activeBtn.classList.add('active');

      const container = document.getElementById(`subtab-content-${userId}`);
      const list = data[tab] || [];

      if (!list.length) {
        container.innerHTML = `<div style="text-align:center;padding:14px;color:#94a3b8;font-size:12px;">No ${tab} recorded yet.</div>`;
        return;
      }

      if (tab === 'deposits') {
        container.innerHTML = list.map(d => `
          <div class="sub-item">
            <div>
              <strong>+${fmt(d.amount)}</strong> &bull; ${d.reference || 'REF'}
              <div style="color:#64748b;font-size:11px;">${new Date(d.created_at).toLocaleString()}</div>
            </div>
            <span class="sub-badge" style="background:#e0f2fe;color:#0369a1;">${d.status}</span>
          </div>
        `).join('');
      } else if (tab === 'withdrawals') {
        container.innerHTML = list.map(w => `
          <div class="sub-item">
            <div>
              <strong>-${fmt(w.amount)}</strong> &bull; ${w.bank_name || 'Bank'}
              <div style="color:#64748b;font-size:11px;">${new Date(w.created_at).toLocaleString()}</div>
            </div>
            <span class="sub-badge" style="background:#fee2e2;color:#b91c1c;">${w.status}</span>
          </div>
        `).join('');
      } else if (tab === 'investments') {
        container.innerHTML = list.map(p => `
          <div class="sub-item">
            <div>
              <strong>${p.product_name}</strong> &bull; ${fmt(p.price)}
              <div style="color:#64748b;font-size:11px;">Cycle: ${p.period_days} Days &bull; Daily: ${fmt(p.daily_income)}</div>
            </div>
            <span class="sub-badge" style="background:#dcfce7;color:#166534;">${p.status}</span>
          </div>
        `).join('');
      } else if (tab === 'logs') {
        container.innerHTML = list.map(l => `
          <div class="sub-item">
            <div>
              <strong>${l.action_type}</strong>: ${l.details}
              <div style="color:#64748b;font-size:11px;">${new Date(l.created_at).toLocaleString()}</div>
            </div>
          </div>
        `).join('');
      }
    }

    // 10. Balance Adjustment Action
    async function handleAdjust(userId, direction) {
      const amount = document.getElementById(`adj-amount-${userId}`).value;
      const wallet_type = document.getElementById(`adj-wallet-${userId}`).value;

      if (!amount || parseFloat(amount) <= 0) {
        return alert('Please enter a valid adjustment amount.');
      }

      const confirmed = confirm(`Are you sure you want to ${direction.toUpperCase()} ${fmt(amount)} to this user's ${wallet_type} wallet?`);
      if (!confirmed) return;

      try {
        const res = await adminFetch('adjust-balance', {
          method: 'POST',
          body: { user_id: userId, wallet_type, direction, amount }
        });
        alert(res.message);
        toggleUserDetails(userId); // Refresh full card with new balances
      } catch (err) {
        alert(err.message);
      }
    }

    // 11. Delete User
    async function deleteUser(userId) {
      const confirmed = confirm('WARNING: Are you sure you want to completely DELETE this user? All balances and records will be removed.');
      if (!confirmed) return;

      try {
        const res = await adminFetch('delete-user', {
          method: 'POST',
          body: { user_id: userId }
        });
        alert(res.message);
        loadUsers();
      } catch (err) {
        alert(err.message);
      }
    }

    // 12. Reset Password
    async function resetPassword(userId) {
      const confirmed = confirm('Reset this user\'s password to 1234?');
      if (!confirmed) return;

      try {
        const res = await adminFetch('reset-password', {
          method: 'POST',
          body: { user_id: userId }
        });
        alert(res.message);
      } catch (err) {
        alert(err.message);
      }
    }

    // 13. Ban / Unban Toggle
    async function toggleBan(userId) {
      try {
        const res = await adminFetch('toggle-ban', {
          method: 'POST',
          body: { user_id: userId }
        });
        alert(res.message);
        loadUsers();
      } catch (err) {
        alert(err.message);
      }
    }

    // 14. Login as User / Impersonation
    async function impersonateUser(userId) {
      const confirmed = confirm('Log into this user\'s account as administrator?');
      if (!confirmed) return;

      try {
        const res = await adminFetch('impersonate', {
          method: 'POST',
          body: { user_id: userId }
        });
        if (res.token) {
          localStorage.setItem('nv_token', res.token);
        }
        alert(res.message + ' Redirecting to user app...');
        window.location.href = '/index.html';
      } catch (err) {
        alert(err.message);
      }
    }

    // Toggles for Package Withdrawal Rule & Promoter status
    async function togglePackageRule(userId) {
      await adminFetch('toggle-package-rule', { method: 'POST', body: { user_id: userId } });
      toggleUserDetails(userId);
    }

    async function togglePromoter(userId) {
      await adminFetch('toggle-promoter', { method: 'POST', body: { user_id: userId } });
      toggleUserDetails(userId);
    }

    loadUsers();
  </script>
</body>
</html>
